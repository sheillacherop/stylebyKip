<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK50</title>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Editorial Reset */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --white: #ffffff;
            --pure-black: #000000;
            --dark-blue: #101c42;
            --accent-burgundy: #4a1525;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--pure-black);
            color: var(--white);
            overflow-x: hidden;
            height: 100vh;
        }

        /* Premium Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 35px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 1000;
        }

        .logo {
            font-family: 'Rock Salt', cursive;
            font-size: 1.6rem;
            color: var(--white);
            text-decoration: none;
            letter-spacing: -1px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            margin-left: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 1.5px;
            background-color: var(--white);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after { 
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        /* Centered Hero Section Container */
        .hero {
            height: 100vh;
            width: 100%;
            /* Added a subtle full-screen dim overlay to ensure white text stays readable over your background image */
            background: linear-gradient(0deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.4) 100%),
                        url('images/wall2.png') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        } 

        /* Clean Minimalist Text Wrapper (No solid black background or borders) */
        .intro-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .intro-container p {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: var(--white);
            font-weight: 400;
            letter-spacing: 0.5px;
            /* Subtly shadows text to keep it high-contrast against light areas of the image */
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* Button Layout */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 16px 36px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-block;
            border-radius: 4px;
        }

        .btn-primary {
            background: var(--white);
            color: var(--pure-black);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--dark-blue), var(--accent-burgundy));
            color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(16, 28, 66, 0.5);
        }

        .btn-secondary {
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: var(--white);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive styling for smaller screens */
        @media (max-width: 768px) {
            nav { padding: 25px 30px; }
            .intro-container p { font-size: 1.1rem; }
            .btn-group { flex-direction: column; gap: 12px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">MK50</a>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="products.html">Shop Drops</a>
            <a href="orders.html">My Orders</a>
            <a href="contacts.html">Contacts</a>
        </div>
    </nav>

    <section class="hero">
        <div class="intro-container">
            <p>
                Elite footwear engineered from the ground up.<br>
                Bold innovation meets refined street style.<br>
                Elevate your rotation.
            </p>
            
            <div class="btn-group">
                <a href="products.html" class="btn btn-primary">Shop Drops</a>
                <a href="orders.html" class="btn btn-secondary">Track Orders</a>
            </div>
        </div>
    </section>

</body>
</html>
